name: OpenAI response parser offline test
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/openai-api-key-test.yml"
      - "automation/scripts/generate_ayaka_prompt.py"
      - "tests/test_ayaka_offline_response.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate a synthetic response without API credentials
        run: python3 -m unittest discover -s tests -p test_ayaka_offline_response.py
