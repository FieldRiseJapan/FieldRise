name: OpenAI API Key Connectivity Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-openai-api:
    name: Verify OPENAI_API_KEY can call OpenAI Responses API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Check that the secret is available
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "❌ OPENAI_API_KEY is not available to this workflow."
            exit 1
          fi
          echo "✅ OPENAI_API_KEY is available (value is never printed)."

      - name: Call OpenAI Responses API
        shell: bash
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/openai-response.json"
          http_code="$(curl -sS -o "$response_file" -w '%{http_code}' \
            https://api.openai.com/v1/responses \
            -H "Authorization: Bearer ${OPENAI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"model":"gpt-5","input":"Reply with exactly: FieldRise OpenAI API connection OK"}')"

          echo "HTTP status: ${http_code}"

          if [[ "$http_code" != "200" ]]; then
            echo "❌ OpenAI API request failed. Response body (without credentials):"
            cat "$response_file"
            exit 1
          fi

          python3 - "$response_file" <<'PY'
          import json
          import sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text())
          text = data.get("output_text", "")
          if not text:
              for item in data.get("output", []):
                  for content in item.get("content", []):
                      if content.get("type") == "output_text":
                          text += content.get("text", "")
          print("OpenAI response:", text.strip())
          if "FieldRise OpenAI API connection OK" not in text:
              raise SystemExit("❌ Unexpected OpenAI response")
          print("✅ OpenAI Responses API connectivity test passed.")
          PY

      - name: Test summary
        if: ${{ success() }}
        run: |
          {
            echo "## OpenAI API Key Test"
            echo ""
            echo "✅ GitHub Secret OPENAI_API_KEY was available to the workflow."
            echo "✅ OpenAI Responses API returned the expected test response."
            echo ""
            echo "Next step: build the analysis → Ayaka prompt-generation workflow."
          } >> "$GITHUB_STEP_SUMMARY"
