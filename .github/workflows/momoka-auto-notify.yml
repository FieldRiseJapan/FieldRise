name: 桃花 - CTO指示の自動受領通知

on:
  push:
    branches: [main]
    paths:
      - "cto/outbox/**"
  workflow_dispatch:
    inputs:
      instruction_path:
        description: "検証対象の cto/outbox/ 配下のMarkdownファイル"
        required: true
        type: string
      dry_run:
        description: "Manus APIを呼び出さず、検知・証跡記録だけを検証する"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: momoka-auto-notify
  cancel-in-progress: false

jobs:
  notify-momoka:
    name: 指示を検知して桃花の受領処理を起動
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.sha }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_BEFORE: ${{ github.event.before }}
      MANUAL_INSTRUCTION_PATH: ${{ inputs.instruction_path }}
      DRY_RUN: ${{ inputs.dry_run || false }}
      MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 新規の桃花向け指示書を特定
        id: candidates
        shell: bash
        run: |
          set -euo pipefail

          is_target_instruction() {
            local path="$1"
            [[ "$path" == cto/outbox/*.md ]] || return 1
            [[ "$path" != "cto/outbox/README.md" ]] || return 1
            [[ "$path" != *_reply.md ]] || return 1
          }

          candidates_file="$RUNNER_TEMP/momoka-instruction-candidates.txt"
          : > "$candidates_file"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            is_target_instruction "$MANUAL_INSTRUCTION_PATH" || {
              echo "手動検証の対象は cto/outbox/ 配下の返信ではない Markdown ファイルに限定されます。" >&2
              exit 1
            }
            git cat-file -e "$SOURCE_SHA:$MANUAL_INSTRUCTION_PATH" || {
              echo "指定された指示書が対象コミットに存在しません: $MANUAL_INSTRUCTION_PATH" >&2
              exit 1
            }
            printf '%s\n' "$MANUAL_INSTRUCTION_PATH" >> "$candidates_file"
          elif [[ "$EVENT_BEFORE" =~ ^0+$ ]]; then
            git diff-tree --no-commit-id --name-only -r "$SOURCE_SHA" -- cto/outbox/ \
              | while IFS= read -r path; do
                  if is_target_instruction "$path"; then printf '%s\n' "$path"; fi
                done >> "$candidates_file"
          else
            git diff --name-only --diff-filter=A "$EVENT_BEFORE" "$SOURCE_SHA" -- cto/outbox/ \
              | while IFS= read -r path; do
                  if is_target_instruction "$path"; then printf '%s\n' "$path"; fi
                done >> "$candidates_file"
          fi

          sort -u "$candidates_file" -o "$candidates_file"
          count="$(wc -l < "$candidates_file" | tr -d ' ')"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "candidate_file=$candidates_file" >> "$GITHUB_OUTPUT"
          {
            echo "## 桃花への自動受領通知"
            echo "- Source commit: \`$SOURCE_SHA\`"
            echo "- Event: \`$EVENT_NAME\`"
            echo "- Candidate count: \`$count\`"
            if [[ "$count" -gt 0 ]]; then
              echo "- Candidates:"
              sed 's/^/  - `/' "$candidates_file" | sed 's/$/`/'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 受領トリガーを発火し証跡を保存
        if: ${{ steps.candidates.outputs.count != '0' }}
        shell: bash
        run: |
          set -euo pipefail

          receipt_root="automation/momoka-receipts"
          mkdir -p "$receipt_root"
          git config user.name "FieldRise-Momoka-Notifier"
          git config user.email "momoka-notifier@fieldrise.local"

          commit_receipt() {
            local message="$1"
            git add -- "$receipt_path"
            if git diff --cached --quiet; then
              return 0
            fi
            git commit -m "$message"
            git pull --rebase origin main
            git push origin HEAD:main
          }

          extract_field() {
            local pattern="$1"
            local fallback="$2"
            local value
            value="$(grep -Eim1 "$pattern" "$instruction_path" | sed -E 's/^[^:：]*[:：][[:space:]]*//; s/[`*]//g' | tr -d '\r' || true)"
            if [[ -z "$value" ]]; then
              value="$fallback"
            fi
            printf '%s' "$value"
          }

          while IFS= read -r instruction_path; do
            [[ -n "$instruction_path" ]] || continue

            path_hash="$(printf '%s' "$instruction_path" | sha256sum | cut -c1-12)"
            receipt_path="$receipt_root/${SOURCE_SHA}-${path_hash}.json"
            receipt_ref="origin/main:$receipt_path"

            if git cat-file -e "$receipt_ref" 2>/dev/null; then
              existing_status="$(git show "$receipt_ref" | jq -r '.delivery.status // "unknown"')"
              if [[ "$existing_status" == "received" ]]; then
                echo "重複防止: すでに受領済みです: $instruction_path"
                echo "- Duplicate skipped: \`$instruction_path\`" >> "$GITHUB_STEP_SUMMARY"
                continue
              fi
              if [[ "$existing_status" == "attempting" ]]; then
                echo "不明な送信状態のため、重複を避けて停止します: $instruction_path" >&2
                echo "- Manual review required (attempting): \`$instruction_path\`" >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
            fi

            instruction_id="$(extract_field '^[[:space:]]*(\*\*)?(タスクID|指示ID|[Ii]nstruction[ _-]?[Ii][Dd]|[Tt]ask[ _-]?[Ii][Dd])(\*\*)?[[:space:]]*[:：]' '未指定')"
            priority="$(extract_field '^[[:space:]]*(\*\*)?(優先度|[Pp]riority)(\*\*)?[[:space:]]*[:：]' '未指定')"
            created_at="$(git log -1 --format=%cI "$SOURCE_SHA" -- "$instruction_path")"
            instruction_url="https://github.com/${GITHUB_REPOSITORY}/blob/${SOURCE_SHA}/${instruction_path}"
            receipt_key="${SOURCE_SHA}:${instruction_path}"

            jq -n \
              --arg receipt_key "$receipt_key" \
              --arg instruction_id "$instruction_id" \
              --arg instruction_path "$instruction_path" \
              --arg source_sha "$SOURCE_SHA" \
              --arg source_url "$instruction_url" \
              --arg priority "$priority" \
              --arg created_at "$created_at" \
              --arg started_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{schema_version: 1, instruction: {receipt_key: $receipt_key, id: $instruction_id, path: $instruction_path, source_sha: $source_sha, source_url: $source_url, priority: $priority, created_at: $created_at}, delivery: {recipient: "Manus default agent (桃花)", method: "Manus API task.sendMessage", status: "attempting", started_at: $started_at}}' \
              > "$receipt_path"
            commit_receipt "chore: claim Momoka instruction ${SOURCE_SHA:0:12}"

            status="failed"
            detail="通知処理が開始できませんでした。"
            http_status=""
            delivered_at=""

            if [[ "$DRY_RUN" == "true" ]]; then
              status="dry_run"
              detail="検知・重複防止・証跡記録を検証しました。Manus APIは呼び出していません。"
            elif [[ -z "$MANUS_API_KEY" ]]; then
              status="blocked"
              detail="GitHub Actions Secret MANUS_API_KEY が未設定のため、Manusへの受領トリガーは実行していません。"
            else
              claim_record_path="automation/momoka-claims/${SOURCE_SHA}-${path_hash}.json"
              message="[CTO指示の自動受領・Claim要求]\n\nReceipt key: ${receipt_key}\n指示ID: ${instruction_id}\n優先度: ${priority}\n作成日時: ${created_at}\n指示書: ${instruction_url}\nCommit SHA: ${SOURCE_SHA}\nClaim記録先: ${claim_record_path}\n\nあなたは桃花COOとして、この正式指示書を取得して内容を確認し、直ちにClaimしてください。まずClaim記録先に receipt_key、status=claimed、claimed_at、report_path を持つJSONを作成し、origin/mainへPushしてください。次に指示を実行し、受領・進捗・完了・未完了・ブロッカーを正本の music_ai/reports/cafe/latest_report.md に記録して origin/mainへPushしてください。GitHubに書込めない場合は、理由をblockedとして明確に返してください。"
              claim_schema='{"type":"object","properties":{"receipt_key":{"type":"string"},"claim_state":{"type":"string","enum":["claimed","not_claimed","blocked"]},"claim_record_path":{"type":"string"},"report_path":{"type":"string"},"report_updated":{"type":"boolean"},"task_state":{"type":"string","enum":["completed","in_progress","blocked"]}},"required":["receipt_key","claim_state","claim_record_path","report_path","report_updated","task_state"],"additionalProperties":false}'
              payload="$(jq -n --arg content "$message" --arg title "桃花受領: ${instruction_id}" --argjson claim_schema "$claim_schema" '{title: $title, locale: "ja", interactive_mode: false, hide_in_task_list: false, agent_profile: "manus-1.6", message: {content: $content}, structured_output_schema: $claim_schema}')"
              response_file="$RUNNER_TEMP/manus-response-${path_hash}.json"
              http_status="$(curl --silent --show-error --fail-with-body --max-time 30 --output "$response_file" --write-out '%{http_code}' \
                --request POST 'https://api.manus.ai/v2/task.create' \
                --header 'Content-Type: application/json' \
                --header "x-manus-api-key: $MANUS_API_KEY" \
                --data "$payload" || true)"

              if [[ "$http_status" =~ ^2[0-9][0-9]$ ]] && jq -e '.ok == true and (.task_id | type == "string")' "$response_file" >/dev/null 2>&1; then
                task_id="$(jq -r '.task_id' "$response_file")"
                task_url="$(jq -r '.task_url // empty' "$response_file")"
                status="received_pending_claim"
                detail="Manus APIが桃花の専用受領タスクを作成しました。Claim確認を待機します。"
                delivered_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                claim_status="pending"
                claim_report_path=""
                claim_report_updated=false
                claim_task_state="in_progress"
                claim_confirmed_at=""
                claim_response_file="$RUNNER_TEMP/manus-claim-${path_hash}.json"

                for attempt in $(seq 1 24); do
                  sleep 10
                  claim_http_status="$(curl --silent --show-error --max-time 30 --output "$claim_response_file" --write-out '%{http_code}' \
                    --get 'https://api.manus.ai/v2/task.listMessages' \
                    --data-urlencode "task_id=$task_id" \
                    --data-urlencode 'order=desc' \
                    --data-urlencode 'limit=100' \
                    --header "x-manus-api-key: $MANUS_API_KEY" || true)"
                  [[ "$claim_http_status" =~ ^2[0-9][0-9]$ ]] || continue

                  claim_value="$(jq -cer --arg receipt_key "$receipt_key" '[.messages[] | select(.type == "structured_output_result" and .structured_output_result.success == true and .structured_output_result.value.receipt_key == $receipt_key) | .structured_output_result.value] | last // empty' "$claim_response_file" 2>/dev/null || true)"
                  [[ -n "$claim_value" ]] || continue

                  claim_status="$(jq -r '.claim_state' <<< "$claim_value")"
                  claim_report_path="$(jq -r '.report_path' <<< "$claim_value")"
                  claim_report_updated="$(jq -r '.report_updated' <<< "$claim_value")"
                  claim_task_state="$(jq -r '.task_state' <<< "$claim_value")"
                  claim_confirmed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

                  if [[ "$claim_status" == "claimed" && "$claim_report_updated" == "true" ]] && git fetch origin main >/dev/null 2>&1 && git cat-file -e "origin/main:${claim_record_path}" 2>/dev/null; then
                    status="claimed"
                    detail="桃花が専用受領タスクでClaimし、Claim記録と正本報告の更新を完了したことを確認しました。"
                  else
                    status="received_claim_incomplete"
                    detail="桃花からのClaim、Claim記録、または報告更新の完了を確認できませんでした。"
                  fi
                  break
                done

                if [[ "$claim_status" == "pending" ]]; then
                  detail="Manus APIは桃花の専用受領タスクを作成しましたが、4分以内にClaim・報告更新を確認できませんでした。"
                fi
              else
                status="failed"
                detail="Manus APIが桃花の専用受領タスクを作成できませんでした。GitHub Actions Run のログを確認してください。"
              fi
            fi

            tmp_receipt="$RUNNER_TEMP/receipt-${path_hash}.json"
            jq \
              --arg status "$status" \
              --arg detail "$detail" \
              --arg http_status "$http_status" \
              --arg finished_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg delivered_at "$delivered_at" \
              --arg claim_status "${claim_status:-not_requested}" \
              --arg claim_report_path "${claim_report_path:-}" \
              --argjson claim_report_updated "${claim_report_updated:-false}" \
              --arg claim_task_state "${claim_task_state:-}" \
              --arg claim_confirmed_at "${claim_confirmed_at:-}" \
              --arg task_id "${task_id:-}" \
              --arg task_url "${task_url:-}" \
              '.delivery.status = $status | .delivery.detail = $detail | .delivery.http_status = (if $http_status == "" then null else $http_status end) | .delivery.finished_at = $finished_at | .delivery.delivered_at = (if $delivered_at == "" then null else $delivered_at end) | .delivery.task_id = (if $task_id == "" then null else $task_id end) | .delivery.task_url = (if $task_url == "" then null else $task_url end) | .claim = {status: $claim_status, report_path: (if $claim_report_path == "" then null else $claim_report_path end), report_updated: $claim_report_updated, task_state: (if $claim_task_state == "" then null else $claim_task_state end), confirmed_at: (if $claim_confirmed_at == "" then null else $claim_confirmed_at end)}' \
              "$receipt_path" > "$tmp_receipt"
            mv "$tmp_receipt" "$receipt_path"
            commit_receipt "chore: record Momoka notification ${status}"

            echo "- \`$instruction_path\`: **$status**" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$status" != "claimed" && "$status" != "dry_run" ]]; then
              echo "E2E受領・Claimは完了していません: $detail" >&2
              exit 1
            fi
          done < "${{ steps.candidates.outputs.candidate_file }}"

      - name: 対象外変更を記録
        if: ${{ steps.candidates.outputs.count == '0' }}
        run: |
          echo "対象となる新規の桃花向け指示書はありません。" >> "$GITHUB_STEP_SUMMARY"
