name: FieldRise AI秘書 - LINE定時報告監視

on:
  schedule:
    # 毎朝 7:05 JST（= 22:05 UTC）に、当日分の送信済み状態を確認する。
    - cron: '5 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: line-briefing-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 7:05 JSTの未送信状態を確認
        id: monitor
        continue-on-error: true
        run: |
          python3 automation/scripts/monitor_line_briefing.py \
            --output-dir monitoring/line_briefing

      - name: 監視レポートを成果物として保存
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: line-briefing-monitor-${{ github.run_id }}
          path: monitoring/line_briefing/
          if-no-files-found: error
          retention-days: 14

      - name: 未送信をワークフロー失敗として明示
        if: ${{ steps.monitor.outcome == 'failure' }}
        run: |
          echo "7:05 JST監視: 本日のLINE定時報告が送信済みとして確認できません。"
          echo "成果物のJSON/Markdownレポートを確認してください。"
          exit 1
