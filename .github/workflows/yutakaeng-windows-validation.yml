name: Build yutakaeng Windows Validation App

on:
  workflow_dispatch:
  push:
    paths:
      - 'yutakaeng_windows_validation/**'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: yutakaeng_windows_validation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Tesseract OCR
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          if (!(Test-Path 'C:\Program Files\Tesseract-OCR\tesseract.exe')) { throw 'Tesseract installation failed.' }

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Download offline PaddleOCR models
        shell: pwsh
        run: |
          python -c "from paddleocr import PaddleOCR; PaddleOCR(lang='en', device='cpu', enable_mkldnn=False, use_doc_orientation_classify=False, use_doc_unwarping=False, use_textline_orientation=False)"
          New-Item -ItemType Directory -Force -Path paddle_models | Out-Null
          Copy-Item -Recurse "$env:USERPROFILE\.paddlex\official_models\PP-OCRv6_medium_det" "paddle_models\PP-OCRv6_medium_det"
          Copy-Item -Recurse "$env:USERPROFILE\.paddlex\official_models\PP-OCRv6_medium_rec" "paddle_models\PP-OCRv6_medium_rec"
          if (!(Test-Path "paddle_models\PP-OCRv6_medium_det\inference.json")) { throw 'PaddleOCR detection model missing.' }
          if (!(Test-Path "paddle_models\PP-OCRv6_medium_rec\inference.json")) { throw 'PaddleOCR recognition model missing.' }

      - name: Run application rule tests
        run: |
          python tests_pipeline_rules.py
          python tests_excel_layout.py
          python tests_multipage_header_images.py
          python tests_terminal_feed.py
          python tests_terminal_screen_layout.py
          python tests_panel_candidate_consensus.py
          python tests_refined_ocr_consensus.py
          python tests_accuracy_tuning_suite.py
          python tests_github_ocr_assets.py

      - name: Build portable Windows folder
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name yutakaeng --collect-all fitz --collect-all rapidocr --collect-all onnxruntime --collect-all paddleocr --collect-all paddle --collect-all paddlex src\app.py
          Copy-Item -Recurse "C:\Program Files\Tesseract-OCR" "dist\yutakaeng\Tesseract-OCR"
          Copy-Item -Recurse "paddle_models" "dist\yutakaeng\paddle_models"
          Copy-Item "PORTABLE_README.txt" "dist\yutakaeng\PORTABLE_README.txt"
          Copy-Item "README.md" "dist\yutakaeng\README.md"
          if (!(Test-Path "dist\yutakaeng\yutakaeng.exe")) { throw 'Executable was not created.' }
          if (!(Test-Path "dist\yutakaeng\Tesseract-OCR\tesseract.exe")) { throw 'Portable Tesseract bundle missing.' }
          if (!(Test-Path "dist\yutakaeng\_internal\rapidocr\models\PP-OCRv6_rec_small.onnx")) { throw 'Offline RapidOCR recognition model missing.' }
          if (!(Test-Path "dist\yutakaeng\_internal\onnxruntime")) { throw 'Offline ONNX Runtime bundle missing.' }
          if (!(Test-Path "dist\yutakaeng\paddle_models\PP-OCRv6_medium_det\inference.json")) { throw 'Offline PaddleOCR detection model missing.' }
          if (!(Test-Path "dist\yutakaeng\paddle_models\PP-OCRv6_medium_rec\inference.json")) { throw 'Offline PaddleOCR recognition model missing.' }

      - name: Package portable folder
        shell: pwsh
        run: |
          Compress-Archive -Path dist\yutakaeng -DestinationPath yutakaeng-windows-validation.zip -Force

      - name: Upload Windows verification app
        uses: actions/upload-artifact@v4
        with:
          name: yutakaeng-windows-validation
          path: yutakaeng_windows_validation/yutakaeng-windows-validation.zip
          if-no-files-found: error
