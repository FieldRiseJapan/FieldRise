name: FieldRise AI秘書 - 定時報告

on:
  schedule:
    # 6:20 JST（= 21:20 UTC 前日）を主起動、6:40 JST（= 21:40 UTC 前日）をバックアップ起動とする。
    # どちらもLINE送信前に7:00 JSTへ同期し、送信済みガードで二重送信を防ぐ。
    - cron: '20 21 * * *'
    - cron: '40 21 * * *'
  workflow_dispatch:
    inputs:
      send_line:
        description: "LINE定時報告を送信する（手動検証時はfalseを推奨）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 天気情報を収集（まんのう町）
        run: python3 automation/scripts/collect_weather.py
        continue-on-error: true

      - name: AIニュースを収集
        run: python3 automation/scripts/collect_ai_news.py
        continue-on-error: true

      - name: SNS分析用CJKフォントと依存関係を導入
        run: pip install -r automation/social_analytics/requirements.txt

      - name: TikTokデータを収集
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: python3 automation/social_analytics/scripts/collect_tiktok.py || echo "TikTok認証または更新に失敗。前回の有効レポートを維持します。"

      - name: Instagramデータを収集
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: python3 automation/social_analytics/scripts/collect_instagram.py || echo "Instagram認証または更新に失敗。前回の有効レポートを維持します。"

      - name: YouTubeデータを収集
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: UCHmI-5eV-xPLSVtcO8QOd7A
        run: python3 automation/social_analytics/scripts/collect_youtube.py || echo "YouTube認証または更新に失敗。前回の有効レポートを維持します。"

      - name: SNSレポートと個別グラフを生成
        run: |
          python3 automation/social_analytics/scripts/generate_report.py
          python3 automation/social_analytics/scripts/generate_morning_report.py

      - name: 定時報告を生成
        run: python3 automation/scripts/generate_briefing.py

      - name: ダッシュボードURLを検証
        run: python3 automation/scripts/test_dashboard_url_in_briefing.py

      - name: 結果をコミット
        run: |
          git config user.name "FieldRise-AI-Secretary"
          git config user.email "ai-secretary@fieldrise.local"
          git add projects/project-001-ai-secretary/ data/ automation/social_analytics/ docs/social_analytics/
          if git diff --cached --quiet; then
            echo "変更なし。コミットをスキップします。"
          else
            git commit -m "AI秘書: 定時報告 $(TZ=Asia/Tokyo date +%Y-%m-%d)"
            git push
          fi

      - name: 本日のLINE送信済み状態を確認
        id: line_guard
        if: ${{ github.event_name == 'schedule' || inputs.send_line }}
        run: |
          marker="data/project-001-ai-secretary/last_line_briefing_sent_jst.txt"
          today=$(TZ=Asia/Tokyo date +%F)
          if [ -f "$marker" ] && grep -Fxq "$today" "$marker"; then
            echo "already_sent=true" >> "$GITHUB_OUTPUT"
            echo "本日（$today）の定時報告は送信済みのため、重複送信を防止します。"
          else
            echo "already_sent=false" >> "$GITHUB_OUTPUT"
            echo "本日（$today）の定時報告は未送信です。"
          fi

      - name: LINE送信時刻を7:00 JSTへ同期
        if: ${{ (github.event_name == 'schedule' || inputs.send_line) && steps.line_guard.outputs.already_sent != 'true' }}
        run: |
          target=$(TZ=Asia/Tokyo date -d 'today 07:00' +%s)
          now=$(TZ=Asia/Tokyo date +%s)
          wait_seconds=$((target - now))
          if [ "$wait_seconds" -gt 0 ]; then
            echo "7:00 JSTまで ${wait_seconds} 秒待機します。"
            sleep "$wait_seconds"
          else
            echo "7:00 JSTを過ぎているため、直ちに送信します。"
          fi

      - name: LINEへ定時報告を通知
        if: ${{ (github.event_name == 'schedule' || inputs.send_line) && steps.line_guard.outputs.already_sent != 'true' }}
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: python3 automation/scripts/send_line_notification.py

      - name: LINE送信済みを記録
        if: ${{ (github.event_name == 'schedule' || inputs.send_line) && steps.line_guard.outputs.already_sent != 'true' }}
        run: |
          marker="data/project-001-ai-secretary/last_line_briefing_sent_jst.txt"
          mkdir -p "$(dirname "$marker")"
          TZ=Asia/Tokyo date +%F > "$marker"
          git config user.name "FieldRise-AI-Secretary"
          git config user.email "ai-secretary@fieldrise.local"
          git add "$marker"
          git commit -m "AI秘書: LINE定時報告送信済み $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          git push
