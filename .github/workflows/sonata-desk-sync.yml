name: Sonata Desk - 正本データ同期

on:
  push:
    branches: [main]
    paths:
      - "music_ai/reference_music/success_song_001.md"
      - "music_ai/reference_music/success_song_002.md"
      - "music_ai/reference_music/audio/README.md"
      - "music_ai/experiments/A1_001-002-ground-truth-capture.md"
      - "music_ai/analysis/cafe/measurements/*_project001_001_vs_suno*.json"
      - "music_ai/suno_database/successful_patterns.md"
      - "dashboard/sonata-desk/scripts/generate_dashboard_data.py"
      - ".github/workflows/sonata-desk-sync.yml"
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "失敗追跡の確認用。生成後に明示的に失敗させる"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: sonata-desk-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 正本から表示用データを生成
        run: python3 dashboard/sonata-desk/scripts/generate_dashboard_data.py

      - name: 生成物を検証
        run: |
          python3 -m json.tool dashboard/sonata-desk/src/generated/dashboard-data.json >/dev/null
          python3 -m json.tool dashboard/sonata-desk/src/generated/sync-status.json >/dev/null
          git diff --check

      - name: 失敗追跡テスト
        if: ${{ inputs.simulate_failure }}
        run: |
          echo "意図的な失敗テストです。正本・生成物は変更しません。"
          echo "確認先: GitHub Actions Run の失敗ステップとStep Summary"
          exit 1

      - name: Action概要に同期状態を記録
        run: |
          echo "## Sonata Desk 正本データ同期" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger: \`${{ github.event_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source digest: \`$(python3 -c 'import json; print(json.load(open("dashboard/sonata-desk/src/generated/sync-status.json"))["sourceDigest"])')\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Generated files: \`dashboard-data.json\`, \`sync-status.json\`" >> "$GITHUB_STEP_SUMMARY"

      - name: 表示データをコミット
        run: |
          git config user.name "FieldRise-Sonata-Desk"
          git config user.email "sonata-desk@fieldrise.local"
          git add dashboard/sonata-desk/src/generated/
          if git diff --cached --quiet; then
            echo "表示データに変更なし。コミットをスキップします。"
          else
            git commit -m "chore: sync Sonata Desk display data"
            git push
          fi
